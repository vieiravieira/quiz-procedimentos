<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quem Sabe a WI?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: gibi/meme — painéis de quadrinho com contorno grosso sobre um céu de retícula. TV = uma tela só; PC dos times = um painel gigante. */
:root{
  --sky:#1FB6EA; --dot:#0F9CD0; --ink:#161320; --paper:#FFFDF6; --sun:#FFE14D;
  --t1:#FF3D8B; --t1-soft:#FFD3E5; --t2:#8A4DFF; --t2-soft:#E4D8FF;
  --ok:#22C55E; --bad:#FF4B4B; --muted:#5B5670;
  --display:"Bangers","Impact","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background-color:var(--sky);background-image:radial-gradient(var(--dot) 17%,transparent 18%);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-weight:800}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#app{min-height:100%;padding-inline:16px;padding-block:16px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink)}
.display{font-family:var(--display);letter-spacing:.03em;font-weight:400;line-height:1}
.btn{border:4px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:5px 5px 0 var(--ink);padding:10px 18px;font-weight:900;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.sun{background:var(--sun)}
.btn.small{padding:6px 12px;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;background:var(--paper);font-weight:900;white-space:nowrap}
.stamp{display:inline-block;font-family:var(--display);border:6px solid currentColor;border-radius:14px;padding:.1em .4em;transform:rotate(-6deg);background:var(--paper);letter-spacing:.04em}
.stamp.v{color:var(--ok)} .stamp.f{color:var(--bad)}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}70%{transform:scale(1.12) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.wobble{animation:wobble 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pop,.wobble,.pulse{animation:none!important}}

/* ---------- escolha de tela ---------- */
.chooser{max-width:900px;margin:auto;width:100%;padding:28px;display:flex;flex-direction:column;gap:22px;text-align:center}
.chooser h1{font-size:clamp(2.6rem,8vw,5rem);margin:0;color:var(--ink)}
.chooser h1 span{color:var(--t1)}
.chooser p{margin:0;color:var(--muted);font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.role{padding:22px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.role .big{font-size:3rem}
.role .display{font-size:2.2rem}
.role small{font-weight:700;color:var(--muted)}
.role.t1{background:var(--t1-soft)} .role.t2{background:var(--t2-soft)} .role.tv{background:var(--sun)}

/* ---------- TV ---------- */
.tv{flex:1;display:grid;grid-template-rows:auto 1fr auto auto;gap:18px;min-height:calc(100vh - 32px)}
.tv-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{font-size:clamp(2rem,4.2vw,3.6rem);color:var(--paper);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.tv-head .chip{font-size:clamp(.95rem,1.4vw,1.3rem)}
.tv-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px;min-height:0}
@media (max-width:820px){.tv-main{grid-template-columns:1fr}}
.stage{position:relative;padding:clamp(18px,3vw,40px);display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0;overflow:hidden}
.qnum{font-size:clamp(1.4rem,2.4vw,2.2rem);color:var(--t1)}
.qtext{font-size:clamp(1.8rem,3.6vw,3.6rem);line-height:1.12;font-weight:900;text-wrap:balance;margin:0}
.timer{position:absolute;top:14px;right:14px;width:clamp(80px,9vw,130px);aspect-ratio:1;max-width:100%}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(2.2rem,4vw,3.8rem)}
.timer.hurry .num{color:var(--bad);animation:pulse .5s infinite}
.stage.has-timer .qtext,.stage.has-timer .qnum{padding-right:clamp(80px,10vw,140px)}
.reveal{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.reveal .stamp{font-size:clamp(2.4rem,5vw,4.8rem);margin:.15em 0 .3em .1em}
.meme{font-family:var(--display);font-size:clamp(2rem,4.4vw,4.2rem);line-height:1.02;margin:0;text-wrap:balance;color:var(--ink)}
.meme em{font-style:normal;color:var(--t1)}
.explica{font-size:clamp(1.05rem,1.7vw,1.5rem);font-weight:700;max-width:60ch;margin:0;padding:12px 16px;border:3px dashed var(--ink);border-radius:14px;background:#FFF6C9}
.explica b{font-weight:900}
.suspense{position:absolute;inset:0;display:grid;place-items:center;background:var(--sun);text-align:center;padding:20px}
.suspense .display{font-size:clamp(2.6rem,6vw,6rem)}
.board{display:flex;flex-direction:column;gap:18px;min-width:0}
.team{padding:clamp(14px,2vw,24px);display:flex;flex-direction:column;gap:10px;position:relative}
.team.t1{background:var(--t1-soft)} .team.t2{background:var(--t2-soft)}
.team .name{font-size:clamp(1.8rem,3vw,2.8rem)}
.team.t1 .name{color:var(--t1)} .team.t2 .name{color:var(--t2)}
.team .pct{font-family:var(--display);font-size:clamp(3.4rem,7vw,6.6rem);line-height:.9;font-variant-numeric:tabular-nums}
.team .pct small{font-size:.45em}
.bar{height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;border-right:3px solid var(--ink);transition:width .9s cubic-bezier(.2,1.3,.4,1)}
.team.t1 .bar i{background:var(--t1)} .team.t2 .bar i{background:var(--t2)}
.team .sub{font-weight:700;color:var(--muted);font-size:clamp(.9rem,1.2vw,1.1rem)}
.crown{position:absolute;top:-30px;right:14px;font-size:clamp(2.4rem,4vw,3.6rem)}
.status{align-self:flex-start;font-size:clamp(1rem,1.5vw,1.35rem)}
.status.ok{background:var(--ok);color:var(--paper)} .status.lock{background:var(--sun)}
.crowd{padding:12px 20px;display:flex;align-items:center;gap:14px;background:var(--sun);font-size:clamp(1.1rem,2vw,1.8rem)}
.crowd .display{font-size:1.25em}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.controls .spacer{flex:1}
.controls label{display:inline-flex;gap:6px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:.9rem}
.lobby{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.lobby h2{font-size:clamp(3rem,7vw,6.4rem);margin:0;line-height:.95}
.lobby h2 span{color:var(--t1)}
.lobby ol{margin:0;padding-left:1.4em;font-size:clamp(1.05rem,1.7vw,1.45rem);display:flex;flex-direction:column;gap:6px;font-weight:700}
.final{text-align:center;align-items:center}
.final h2{font-size:clamp(3rem,8vw,7rem);margin:0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

/* ---------- PC do time ---------- */
.teamview{flex:1;display:flex;flex-direction:column;gap:18px;max-width:1100px;width:100%;margin-inline:auto}
.team-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;color:var(--paper)}
.team-bar.t1{background:var(--t1)} .team-bar.t2{background:var(--t2)}
.team-bar .display{font-size:clamp(2rem,5vw,3.2rem);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.team-bar .chip{color:var(--ink)}
.play{flex:1;padding:clamp(18px,4vw,44px);display:flex;flex-direction:column;gap:22px;justify-content:center}
.play .qtext{font-size:clamp(1.6rem,3.6vw,3rem)}
.tbar{height:26px;border:4px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ok);transition:width .25s linear}
.tbar.hurry i{background:var(--bad)}
.tlabel{font-family:var(--display);font-size:1.8rem}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.answers{grid-template-columns:1fr}}
.ans{border:5px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:clamp(18px,4vw,40px) 10px;font-family:var(--display);font-size:clamp(2.2rem,5.4vw,4.4rem);letter-spacing:.04em;color:var(--paper);-webkit-text-stroke:1.5px var(--ink);transition:transform .08s,box-shadow .08s}
.ans:hover{transform:translate(-3px,-3px);box-shadow:11px 11px 0 var(--ink)}
.ans:active{transform:translate(4px,4px);box-shadow:3px 3px 0 var(--ink)}
.ans.v{background:var(--ok)} .ans.f{background:var(--bad)}
.ans .e{display:block;font-size:.8em;-webkit-text-stroke:0}
.wait{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.wait .big{font-size:clamp(4rem,10vw,7rem)}
.wait .display{font-size:clamp(2.2rem,5vw,3.8rem)}
.wait p{margin:0;font-size:clamp(1.05rem,2vw,1.5rem);font-weight:700;color:var(--muted);max-width:40ch}
.tip{font-weight:700;color:var(--muted);margin:0;text-align:center}

/* ---------- editor ---------- */
.modal{position:fixed;inset:0;background:rgba(22,19,32,.55);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 16px}
.editor{width:min(980px,100%);padding:22px;display:flex;flex-direction:column;gap:16px}
.editor h3{margin:0;font-size:2.2rem}
.form{display:grid;gap:10px;padding:14px;border:3px solid var(--ink);border-radius:14px;background:#FFF6C9}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:900;font-size:.9rem}
.form textarea,.form input[type=text]{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);width:100%}
.vf{display:flex;gap:10px;flex-wrap:wrap}
.vf label{flex-direction:row;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:10px;padding:6px 12px;background:var(--paper)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
@media (max-width:600px){.row2{grid-template-columns:1fr}}
.qlist{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding-right:4px}
.qitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--paper)}
.qitem .t{font-weight:800;min-width:0}
.qitem .t small{display:block;color:var(--muted);font-weight:700}
.qitem .acts{display:flex;gap:6px}
.vchip{font-family:var(--display);font-size:1.2rem;width:2.2em;text-align:center;border:3px solid var(--ink);border-radius:8px;color:var(--paper)}
.vchip.v{background:var(--ok)} .vchip.f{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:800;max-width:calc(100% - 32px)}
.note{padding:14px 18px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;font-weight:700}

/* ---------- canto da TV (aparece só quando mexe o mouse) ---------- */
.corner{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.corner.show,.corner:focus-within{opacity:1;pointer-events:auto}
body:has(.tv){cursor:auto}
/* ---------- painel do ADM ---------- */
.role.adm{background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:4px;align-items:center}
.adm{max-width:1200px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.adm-bar{background:var(--ink)}
.adm-bar .display{font-size:clamp(1.8rem,5vw,2.6rem);-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--t1)}
.adm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.adm-card{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.adm-card h3{margin:0;font-size:1.9rem}
.adm-wide{grid-column:1/-1}
.adm-q{display:flex;flex-direction:column;gap:10px;padding:12px;border:3px solid var(--ink);border-radius:14px;background:#FFF6C9}
.adm-q p{margin:0;font-size:1.2rem;font-weight:900}
.adm-meta{display:flex;justify-content:space-between;align-items:center;font-weight:900}
.adm-meta .tlabel{font-size:1.5rem}
.adm-hint{margin:0;font-weight:700;color:var(--muted)}
.adm-teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-team{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;font-weight:800}
.adm-team.t1{background:var(--t1-soft)} .adm-team.t2{background:var(--t2-soft)}
.adm-team b{font-family:var(--display);font-weight:400;font-size:1.4rem}
.adm-team.t1 b{color:var(--t1)} .adm-team.t2 b{color:var(--t2)}
.big-pct{font-family:var(--display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.adm-main{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,5vw,2.2rem);letter-spacing:.04em;padding:16px}
.adm-opts{display:flex;flex-direction:column;gap:8px}
.adm-opts label{display:flex;gap:8px;align-items:flex-start;font-weight:800}
.adm-opts input{width:20px;height:20px;flex:none;margin-top:2px}
.campo{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:12px;background:var(--paper);color:var(--ink);font-size:1.1rem}
.tabela{overflow-x:auto;border:3px solid var(--ink);border-radius:12px}
.tabela table{border-collapse:collapse;width:100%;min-width:520px;background:var(--paper)}
.tabela th,.tabela td{padding:8px 10px;border-bottom:2px solid #E7E2D3;text-align:left;vertical-align:top}
.tabela th{background:var(--ink);color:var(--paper);font-weight:900}
.tabela td:first-child,.tabela td:nth-child(n+3){white-space:nowrap;font-variant-numeric:tabular-nums}
</style>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
</head>
<body>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const TEMPO = 10;          // segundos por pergunta
const GRACE = 1800;        // folga (ms) para respostas que chegam no último segundo
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const TEAMS = { t1: 'Time 1', t2: 'Time 2' };

let db = null, dbFalhou = false, semConfig = false;
let estado = null, perguntas = [], respostas = {}, carregado = { e: false, p: false };
let papel = null;             // 'tv' | 't1' | 't2'
let deadline = 0, rodadaVista = null, tick = null, suspense = false, revelando = false;
let editorAberto = false, editandoId = null, confirmar = null, embaralhar = true;
let fimRenderizado = null, autoTimer = null, autoRodada = null, autoFim = 0, admLiberado = false;
const AUTO_SEG = 8;   // segundos mostrando o resultado antes da próxima pergunta (modo automático)
let ultE, ultP, ultR;
let som = false, audio = null, ultimoBip = -1, ultimaFase = null;

/* ---------- papel (qual tela é esta) ---------- */
const HASH = { tv: 'tv', time1: 't1', time2: 't2', adm: 'adm' };
function lerPapel() {
  const h = location.hash.replace('#', '');
  if (HASH[h]) return HASH[h];
  try { const s = localStorage.getItem('qsw-papel'); if (s && ['tv','t1','t2','adm'].includes(s)) return s; } catch (e) {}
  return null;
}
function escolher(p) {
  papel = p;
  try { localStorage.setItem('qsw-papel', p); } catch (e) {}
  const back = { tv: 'tv', t1: 'time1', t2: 'time2', adm: 'adm' }[p];
  history.replaceState(null, '', '#' + back);
  if (p === 'tv') pedirWakeLock();
  render();
}
function trocarTela() {
  papel = null;
  try { localStorage.removeItem('qsw-papel'); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  render();
}

/* ---------- dados ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3500);
}
function falha(e) {
  console.error(e);
  toast('Não consegui salvar agora. Confira a internet e tente de novo.');
}
const faseAtual = () => (estado && estado.fase) || 'lobby';
const hist = () => (estado && estado.hist) || [];
function pct(t) {
  const h = hist(); if (!h.length) return 0;
  return Math.round(h.filter(x => x[t] === 'certo').length / h.length * 100);
}
function acertos(t) { return hist().filter(x => x[t] === 'certo').length; }
const resp = t => estado && respostas[estado.rodada + '_' + t];

function ok(r) { if (r.error) throw r.error; return r.data; }
async function carregarEstado() {
  const d = ok(await db.from('estado').select('dados').eq('id', 1).maybeSingle());
  const j = JSON.stringify(d && d.dados); if (j === ultE) return; ultE = j;
  estado = d && d.dados && d.dados.fase ? d.dados : null; carregado.e = true; aoMudarEstado();
}
async function carregarPerguntas() {
  const d = ok(await db.from('perguntas').select('*').order('ordem'));
  const j = JSON.stringify(d); if (j === ultP) return; ultP = j;
  perguntas = d || []; carregado.p = true; render();
}
async function carregarRespostas() {
  const d = ok(await db.from('respostas').select('*'));
  const j = JSON.stringify(d); if (j === ultR) return; ultR = j;
  const r = {}; (d || []).forEach(x => r[x.id] = x); respostas = r; aoMudarRespostas();
}
async function recarregarTudo() {
  try { await Promise.all([carregarEstado(), carregarPerguntas(), carregarRespostas()]); dbFalhou = false; }
  catch (e) { dbFalhou = true; render(); }
}
async function iniciarDb() {
  const cfg = window.JOGO_CONFIG || {};
  if (!window.supabase || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_URL.includes('COLE_AQUI')) { semConfig = true; dbFalhou = true; render(); return; }
  db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  await recarregarTudo();
  db.channel('jogo')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'estado' }, () => carregarEstado().catch(() => {}))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'perguntas' }, () => carregarPerguntas().catch(() => {}))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'respostas' }, () => carregarRespostas().catch(() => {}))
    .subscribe(st => { if (st === 'SUBSCRIBED') recarregarTudo(); });
  // rede de segurança: se o tempo real cair, atualiza a cada 3 s
  setInterval(() => { if (!document.hidden) { carregarEstado().catch(() => {}); carregarRespostas().catch(() => {}); } }, 3000);
}

function aoMudarEstado() {
  const f = faseAtual();
  if (f === 'pergunta' && estado.rodada !== rodadaVista) {
    rodadaVista = estado.rodada;
    suspense = false; revelando = false; ultimoBip = -1;
    // a TV usa o relógio de quem iniciou (é o mesmo PC); os times contam a partir de quando a pergunta chegou
    deadline = (papel === 'tv' && estado.inicio && Math.abs(Date.now() - estado.inicio) < 60000)
      ? estado.inicio + TEMPO * 1000 : Date.now() + TEMPO * 1000;
    iniciarTick();
  }
  if (f !== 'pergunta') { pararTick(); suspense = false; }
  agendarAuto();
  if (papel === 'tv' && f !== ultimaFase) {
    if (f === 'resultado' && estado.res) {
      const r = estado.res;
      (r.t1 === 'certo' || r.t2 === 'certo') ? tocar('ding') : tocar('womp');
      if (r.t1 === 'certo' && r.t2 === 'certo') confete(1600);
    }
    if (f === 'fim') { tocar('fanfarra'); confete(5000); }
  }
  ultimaFase = f;
  render();
}
function aoMudarRespostas() {
  if (papel === 'tv' && faseAtual() === 'pergunta' && resp('t1') && resp('t2') && !suspense) {
    suspense = true; render();
    setTimeout(revelar, 1500);
    return;
  }
  render();
}

function agendarAuto() {
  const f = faseAtual();
  const quer = papel === 'tv' && f === 'resultado' && estado && estado.auto;
  if (!quer) { if (autoTimer) clearInterval(autoTimer); autoTimer = null; autoRodada = null; return; }
  if (autoRodada === estado.rodada) return;
  if (autoTimer) clearInterval(autoTimer);
  autoRodada = estado.rodada; autoFim = Date.now() + AUTO_SEG * 1000;
  autoTimer = setInterval(() => {
    const s = Math.max(0, Math.ceil((autoFim - Date.now()) / 1000));
    const el = $('#autoseg'); if (el) el.textContent = s;
    if (s === 0 && faseAtual() === 'resultado' && estado.rodada === autoRodada) { clearInterval(autoTimer); autoTimer = null; proxima(); }
  }, 250);
}

/* ---------- relógio ---------- */
function iniciarTick() {
  pararTick();
  tick = setInterval(() => {
    const rest = Math.max(0, deadline - Date.now());
    atualizarTimer(rest);
    if (papel === 'tv') {
      const s = Math.ceil(rest / 1000);
      if (s <= 3 && s > 0 && s !== ultimoBip) { ultimoBip = s; tocar('tick'); }
      if (Date.now() > deadline + GRACE && !suspense) { suspense = true; render(); setTimeout(revelar, 900); }
    } else if (rest === 0 && !resp(papel) && fimRenderizado !== estado.rodada) { fimRenderizado = estado.rodada; render(); }
  }, 200);
  atualizarTimer(Math.max(0, deadline - Date.now()));
}
function pararTick() { if (tick) clearInterval(tick); tick = null; }
function atualizarTimer(rest) {
  const s = Math.ceil(rest / 1000), frac = rest / (TEMPO * 1000);
  const num = $('#tnum'); if (num) num.textContent = s;
  const ring = $('#tring'); if (ring) ring.style.strokeDashoffset = String(283 * (1 - frac));
  const box = $('#timer'); if (box) box.classList.toggle('hurry', s <= 3);
  const bar = $('#tbar'); if (bar) { bar.style.width = (frac * 100) + '%'; bar.parentElement.classList.toggle('hurry', s <= 3); }
  const lab = $('#tlab'); if (lab) lab.textContent = s + 's';
}

const MEMES = {

  tempo: ['O TEMPO VOOU ✈️', 'O RELÓGIO NÃO PERDOA ⏰']
};
function escolherMeme(res) {
  const c = ['t1', 't2'].filter(t => res[t] === 'certo').length;
  const sem = res.t1 === 'sem' && res.t2 === 'sem';
  const lista = sem ? MEMES.tempo : c === 2 ? MEMES.dois : c === 1 ? MEMES.um : MEMES.zero;
  return lista[Math.floor(Math.random() * lista.length)];
}
async function salvarEstado(novo) {
  try { ok(await db.from('estado').upsert({ id: 1, dados: novo })); return true; } catch (e) { falha(e); return false; }
}
async function comecar() {
  if (!perguntas.length) { toast('Cadastre pelo menos uma pergunta no Painel do ADM.'); return; }
  let ordem = perguntas.map(p => p.id);
  if (embaralhar) ordem = ordem.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  await limparRespostas();
  pedirWakeLock();
  await irPara({ fase: 'lobby', ordem, hist: [], auto: !!(estado && estado.auto) }, 0);
}
async function irPara(base, idx) {
  const p = perguntas.find(x => x.id === base.ordem[idx]);
  await salvarEstado({
    ...base, fase: 'pergunta', idx, rodada: rid(), inicio: Date.now(),
    q: { texto: p ? p.texto : '(pergunta removida)', wi: p ? (p.wi || '') : '' },
    gabarito: null, explicacao: '', res: null, meme: ''
  });
}
async function proxima() {
  if (!estado) return comecar();
  const idx = estado.idx + 1;
  if (idx >= estado.ordem.length) return salvarEstado({ ...estado, fase: 'fim' });
  return irPara(estado, idx);
}
async function revelar() {
  if (revelando || !estado || estado.fase !== 'pergunta') return;
  revelando = true;
  const pid = estado.ordem[estado.idx];
  const p = perguntas.find(x => x.id === pid);
  const gab = p ? !!p.resposta : null;
  const r = t => { const a = resp(t); if (!a) return 'sem'; return a.v === gab ? 'certo' : 'errado'; };
  const res = { t1: r('t1'), t2: r('t2') };
  const salvou = await salvarEstado({
    ...estado, fase: 'resultado', gabarito: gab, explicacao: p ? (p.explicacao || '') : '',
    res, meme: escolherMeme(res),
    hist: [...hist().filter(h => h.rodada !== estado.rodada), {
      pid, rodada: estado.rodada, texto: estado.q ? estado.q.texto : '', gab,
      t1: res.t1, t2: res.t2,
      v1: resp('t1') ? resp('t1').v : null, v2: resp('t2') ? resp('t2').v : null
    }]
  });
  revelando = false;
  if (!salvou) { suspense = false; render(); }
}
async function limparRespostas() {
  try { ok(await db.from('respostas').delete().neq('id', '')); } catch (e) { falha(e); }
}
async function reiniciar() {
  if (confirmar !== 'reiniciar') { confirmar = 'reiniciar'; render(); setTimeout(() => { if (confirmar === 'reiniciar') { confirmar = null; render(); } }, 4000); return; }
  confirmar = null;
  await salvarEstado({ fase: 'lobby', ordem: [], hist: [], auto: !!(estado && estado.auto) });
  await limparRespostas();
}
function acaoPrincipal() {
  const f = faseAtual();
  if (f === 'lobby') comecar();
  else if (f === 'pergunta') {
    if (papel === 'adm') revelar();
    else if (!suspense) { suspense = true; render(); setTimeout(revelar, 900); }
  }
  else if (f === 'resultado') proxima();
  else if (f === 'fim') reiniciar();
}

async function alternarAuto(v) {

async function responder(v) {

/* ---------- som, tela cheia, confete ---------- */
function ligarSom() {
  som = !som;
  if (som && !audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { som = false; } }
  if (som) tocar('ding');
  render();
}
function nota(freq, ini, dur, tipo = 'square', vol = .08) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo; o.frequency.setValueAtTime(freq, audio.currentTime + ini);
  g.gain.setValueAtTime(vol, audio.currentTime + ini);
  g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + ini + dur);
  o.connect(g).connect(audio.destination); o.start(audio.currentTime + ini); o.stop(audio.currentTime + ini + dur + .02);
}
function tocar(tipo) {
  if (!som || !audio) return;
  try {
    if (tipo === 'tick') nota(880, 0, .08);
    if (tipo === 'ding') { nota(660, 0, .15); nota(990, .12, .3); }
    if (tipo === 'womp') { nota(392, 0, .3, 'sawtooth'); nota(370, .3, .3, 'sawtooth'); nota(349, .6, .3, 'sawtooth'); nota(330, .9, .7, 'sawtooth'); }
    if (tipo === 'fanfarra') [523, 659, 784, 1047, 784, 1047].forEach((f, i) => nota(f, i * .14, .22, 'triangle', .1));
  } catch (e) {}
}
function telaCheia() {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => toast('Este navegador não deixou abrir em tela cheia. Use F11.'));
}
let wake = null;
async function pedirWakeLock() { try { if (!wake && navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
function confete(ms) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), ctx = c.getContext('2d'); c.hidden = false;
  c.width = innerWidth; c.height = innerHeight;
  const cores = ['#FF3D8B', '#8A4DFF', '#FFE14D', '#22C55E', '#1FB6EA', '#FF9F1C'];
  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: 8 + Math.random() * 10, c: cores[Math.floor(Math.random() * cores.length)] }));
  const fim = Date.now() + ms;
  (function f() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; if (p.y > c.height + 20 && Date.now() < fim) { p.y = -20; p.x = Math.random() * c.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (Date.now() < fim + 2500) requestAnimationFrame(f); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })();
}

    <div class="chooser panel" style="max-width:460px">
      <h1 class="display" style="font-size:2.6rem">⚙️ PAINEL DO ADM</h1>
      <p>Digite a senha do apresentador.</p>
      <form id="f-senha" style="display:flex;flex-direction:column;gap:12px">
        <input type="password" id="adm-senha" class="campo" autocomplete="current-password" placeholder="Senha">
        <button class="btn sun" type="submit">Entrar</button>
      </form>
      <button class="btn small" id="b-troca">↩ Trocar tela</button>
    </div>`;
    $('#f-senha').onsubmit = e => {
      e.preventDefault();
      if ($('#adm-senha').value.trim() === senhaAdm()) {
        admLiberado = true; try { sessionStorage.setItem('qsw-adm', senhaAdm()); } catch (er) {}
        manterForm = false; render();
      } else toast('Senha errada. Tente de novo.');
    };
    $('#b-troca').onclick = trocarTela;
    return;
  }
  const f = faseAtual();
  const total = (estado && estado.ordem && estado.ordem.length) || perguntas.length;
  const n = estado && estado.idx != null ? estado.idx + 1 : 0;
  const pAtual = estado && estado.ordem ? perguntas.find(x => x.id === estado.ordem[estado.idx]) : null;
  const nomeFase = { lobby: '⏸ Aguardando início', pergunta: '⏱ Pergunta no ar', resultado: '📣 Mostrando resultado', fim: '🏁 Jogo encerrado' }[f];
  const principal = { lobby: '▶ COMEÇAR JOGO', pergunta: '⏭ REVELAR AGORA', resultado: estado && estado.idx + 1 >= total ? '🏁 VER RESULTADO FINAL' : '▶ PRÓXIMA PERGUNTA', fim: '🔁 JOGAR DE NOVO' }[f];
  const stTime = t => {
    if (f === 'pergunta') { const r = resp(t); return r ? `🔒 ${r.v ? 'Verdadeiro' : 'Falso'}` : '🤔 Pensando…'; }
    if (f === 'resultado' && estado.res) return { certo: '✅ Acertou', errado: '❌ Errou', sem: '⏰ Sem resposta' }[estado.res[t]];
    return '—';
  };
  const vf = v => v === true ? 'V' : v === false ? 'F' : '—';
  const marca = r => ({ certo: '✅', errado: '❌', sem: '⏰' }[r] || '');
  const h = hist();

  app.innerHTML = `
  <div class="adm">
    <div class="panel team-bar adm-bar">
      <span class="display">⚙️ PAINEL DO ADM</span>
      <span class="chip">${nomeFase}</span>
    </div>
    ${avisoConexao()}
    <div class="adm-grid">
      <section class="panel adm-card">
        <h3 class="display">AGORA NA TV</h3>
        ${f === 'pergunta' || f === 'resultado' ? `
          <div class="adm-q">
            <div class="adm-meta"><span>Pergunta ${n} de ${total}</span>${f === 'pergunta' ? `<span class="tlabel" id="tlab">${TEMPO}s</span>` : ''}</div>
            ${f === 'pergunta' ? `<div class="tbar"><i id="tbar" style="width:100%"></i></div>` : ''}
            <p>${esc(estado.q && estado.q.texto)}</p>
            <span class="chip">Gabarito: <b>${pAtual ? (pAtual.resposta ? '✔ VERDADEIRO' : '✘ FALSO') : '?'}</b></span>
          </div>` : `<p class="adm-hint">${f === 'lobby' ? `${perguntas.length} pergunta${perguntas.length === 1 ? '' : 's'} pronta${perguntas.length === 1 ? '' : 's'}. Quando os times estiverem nos PCs, clique em Começar.` : 'Jogo encerrado. O placar final está na TV.'}</p>`}
        <div class="adm-teams">
          <div class="adm-team t1"><b>Time 1</b><span class="big-pct">${pct('t1')}%</span><span>${stTime('t1')}</span></div>
          <div class="adm-team t2"><b>Time 2</b><span class="big-pct">${pct('t2')}%</span><span>${stTime('t2')}</span></div>
        </div>
        <button class="btn sun adm-main" id="b-main" ${!db || revelando ? 'disabled' : ''}>${principal}</button>
        <div class="adm-opts">
          <label for="c-auto"><input type="checkbox" id="c-auto" data-fixo="1" ${estado && estado.auto ? 'checked' : ''}> Modo automático: próxima pergunta sozinha ${AUTO_SEG}s depois do resultado</label>
          ${f === 'lobby' ? `<label for="c-emb"><input type="checkbox" id="c-emb" data-fixo="1" ${embaralhar ? 'checked' : ''}> Embaralhar perguntas</label>` : ''}
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn small" id="b-re">${confirmar === 'reiniciar' ? 'Certeza? Clique de novo' : '🧹 Reiniciar placar'}</button>
          <button class="btn small" id="b-troca">↩ Trocar tela</button>
        </div>
      </section>

      <section class="panel adm-card">
        <h3 class="display">✏️ PERGUNTAS (${perguntas.length})</h3>
        ${editorHtml()}
      </section>

      <section class="panel adm-card adm-wide">
        <h3 class="display">📊 HISTÓRICO DA PARTIDA</h3>
        ${h.length ? `<div class="tabela"><table>
          <thead><tr><th>#</th><th>Pergunta</th><th>Gabarito</th><th>Time 1</th><th>Time 2</th></tr></thead>
          <tbody>${h.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.texto || '')}</td><td>${vf(x.gab)}</td><td>${marca(x.t1)} ${vf(x.v1)}</td><td>${marca(x.t2)} ${vf(x.v2)}</td></tr>`).join('')}</tbody>
        </table></div>
        <p class="adm-hint">Use isto para ver quais processos precisam de reforço. Só aparece aqui, nunca na TV.</p>` : `<p class="adm-hint">As rodadas aparecem aqui conforme o jogo anda, com o que cada time respondeu.</p>`}
      </section>
    </div>
  </div>`;

  $('#b-main').onclick = acaoPrincipal;
  $('#b-re').onclick = reiniciar;
  $('#b-troca').onclick = trocarTela;
  $('#c-auto').onchange = e => alternarAuto(e.target.checked);
  const emb = $('#c-emb'); if (emb) emb.onchange = () => { embaralhar = emb.checked; };
  ligarEditor();
  if (f === 'pergunta') atualizarTimer(Math.max(0, deadline - Date.now()));
}

function editorHtml() {
  const p = editandoId ? perguntas.find(x => x.id === editandoId) : null;
  return `
      <div class="form">
        <label for="f-texto">${p ? 'Editando a afirmação' : 'Nova afirmação (os times dizem se é verdadeira ou falsa)'}
          <textarea id="f-texto" rows="2" placeholder="Ex.: Se a tela não ficar verde, posso entregar o pacote e avisar depois.">${esc(p ? p.texto : '')}</textarea></label>
        <div class="vf">
          <label for="f-v"><input type="radio" name="vf" id="f-v" ${p && p.resposta ? 'checked' : ''}> ✔ Verdadeira</label>
          <label for="f-f"><input type="radio" name="vf" id="f-f" ${p && !p.resposta ? 'checked' : ''}> ✘ Falsa</label>
        </div>
        <label for="f-exp">Explicação que aparece na TV depois da resposta
          <input type="text" id="f-exp" value="${esc(p ? p.explicacao : '')}" placeholder="O que a WI diz sobre isso"></label>
        <label for="f-wi">WI de referência
          <input type="text" id="f-wi" value="${esc(p ? p.wi : '')}" placeholder="Ex.: WI SVC-217-76"></label>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn sun small" id="e-salvar">${p ? '💾 Salvar alteração' : '➕ Adicionar pergunta'}</button>
          ${p ? `<button class="btn small" id="e-cancelar">Cancelar edição</button>` : ''}
        </div>
      </div>
      <div class="qlist">
        ${perguntas.length ? perguntas.map((q, i) => `
          <div class="qitem">
            <span class="vchip ${q.resposta ? 'v' : 'f'}">${q.resposta ? 'V' : 'F'}</span>
            <div class="t">${i + 1}. ${esc(q.texto)}<small>${esc(q.wi || 'Sem WI')}${q.explicacao ? ' · ' + esc(q.explicacao) : ''}</small></div>
            <div class="acts">
              <button class="btn small" data-ed="${q.id}">Editar</button>
              <button class="btn small" data-del="${q.id}">${confirmar === 'del-' + q.id ? 'Certeza?' : 'Excluir'}</button>
            </div>
          </div>`).join('') : `<div class="note">Nenhuma pergunta ainda. Escreva a primeira afirmação acima e marque se é verdadeira ou falsa.</div>`}
      </div>`;
}
function ligarEditor() {
  $('#e-salvar').onclick = salvarPergunta;
  const c = $('#e-cancelar'); if (c) c.onclick = () => { editandoId = null; manterForm = false; render(); };
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { editandoId = b.dataset.ed; manterForm = false; render(); $('#f-texto').focus(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => apagarPergunta(b.dataset.del));
}

function renderTime(t) {
  const f = faseAtual();
  const minha = resp(t);
  const acabou = f === 'pergunta' && Date.now() > deadline;
  let corpo = '';

  if (f === 'lobby') corpo = `<div class="wait"><div class="big wobble">🍿</div><div class="display">SEGURA AÍ!</div><p>O jogo já vai começar. Fiquem de olho nesta tela e conversem antes de clicar: só vale <b>1 clique por pergunta</b>.</p></div>`;
  else if (f === 'pergunta' && !minha && !acabou) corpo = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span class="display" style="font-size:1.8rem">PERGUNTA ${estado.idx + 1} DE ${estado.ordem.length}</span>
        <span class="tlabel" id="tlab">${TEMPO}s</span>
      </div>
      <div class="tbar"><i id="tbar" style="width:100%"></i></div>
      <p class="qtext">${esc(estado.q && estado.q.texto)}</p>
      <div class="answers">
        <button class="ans v" id="a-v"><span class="e">👍</span>VERDADEIRO</button>
        <button class="ans f" id="a-f"><span class="e">👎</span>FALSO</button>
      </div>
      <p class="tip">Decidam juntos! 🤝 Depois do clique não dá pra trocar.</p>`;
  else if (f === 'pergunta' && minha) corpo = `<div class="wait"><div class="big pop">🔒</div><div class="display">RESPOSTA TRAVADA: ${minha.v ? 'VERDADEIRO' : 'FALSO'}</div><p>Agora é esperar o outro time… 🤫 O resultado sai na TV para os dois ao mesmo tempo.</p></div>`;
  else if (f === 'pergunta') corpo = `<div class="wait"><div class="big pop">⏰</div><div class="display">O TEMPO ACABOU!</div><p>Olha a TV que o resultado já vem.</p></div>`;
  else if (f === 'resultado') {
    const r = estado.res ? estado.res[t] : 'sem';
    const txt = r === 'certo' ? ['🎉', 'MANDARAM BEM!'] : r === 'errado' ? ['🙃', 'QUASE! BORA NA PRÓXIMA'] : ['⏰', 'O TEMPO VOOU!'];
    corpo = `<div class="wait">
      <div class="big pop">${txt[0]}</div><div class="display">${txt[1]}</div>
      <span class="stamp ${estado.gabarito ? 'v' : 'f'}" style="font-size:2.4rem">${estado.gabarito ? '✔ VERDADEIRO' : '✘ FALSO'}</span>
      ${estado.explicacao ? `<p class="explica" style="text-align:left"><b>Segundo a WI:</b> ${esc(estado.explicacao)}</p>` : ''}
      <p>Seu time está com <b>${pct(t)}%</b> de acerto. Olha o placar na TV 📺</p></div>`;
  }
  else if (f === 'fim') corpo = `<div class="wait"><div class="big pop">🏁</div><div class="display">FIM DE JOGO!</div><p>Seu time fechou com <b>${pct(t)}%</b> de acerto. Valeu por jogar! 👏</p></div>`;

  app.innerHTML = `
  <div class="teamview">
    <div class="panel team-bar ${t}">
      <span class="display">${t === 't1' ? '🩷' : '💜'} ${TEAMS[t].toUpperCase()}</span>
      <span class="chip">${pct(t)}% de acerto</span>
    </div>
    <div class="panel play">${avisoConexao()}${corpo}</div>
    <div class="controls"><button class="btn small" id="b-troca">↩ Trocar tela</button></div>
  </div>`;
  $('#b-troca').onclick = trocarTela;
  const v = $('#a-v'), fb = $('#a-f');
  if (v) v.onclick = () => responder(true);
  if (fb) fb.onclick = () => responder(false);
  if (f === 'pergunta') atualizarTimer(Math.max(0, deadline - Date.now()));
}

document.addEventListener('keydown', e => {
  if (papel !== 'tv') return;
  if (e.target.closest('input,textarea,button')) return;
  if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); acaoPrincipal(); }
});
addEventListener('hashchange', () => { const p = lerPapel(); if (p && p !== papel) escolher(p); });

papel = lerPapel();
render();
iniciarDb();
</script>

</body>
</html>
